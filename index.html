<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Forge Nutrition: protein, creatine, pre-workouts and gym gear.">
<title>Forge Nutrition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: navy sports-shop bands over a cool light ground; condensed display type for headlines and prices; every product drawn as a pack. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e8ecf4; --ink:#0d1733; --muted:#566178; --line:#d7dde9;
  --accent:#d4460a; --on-accent:#ffffff; --band:#0e1a3a; --on-band:#f2f5ff; --band-muted:#a9b6d6;
  --good:#0f7a3d; --warn:#9a5b00; --bad:#b42318; --star:#e0a100; --focus:#2457ff; --r:6px;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1126; --surface:#111b38; --surface-2:#1a2547; --ink:#eaf0ff; --muted:#9eaccb; --line:#26335b;
  --accent:#ff6a2a; --on-accent:#1b0d05; --band:#060c20; --on-band:#f2f5ff; --band-muted:#9eaccb;
  --good:#46d17d; --warn:#f0b24b; --bad:#ff8a7a; --star:#f2b630; --focus:#7da2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1126; --surface:#111b38; --surface-2:#1a2547; --ink:#eaf0ff; --muted:#9eaccb; --line:#26335b;
  --accent:#ff6a2a; --on-accent:#1b0d05; --band:#060c20; --on-band:#f2f5ff; --band-muted:#9eaccb;
  --good:#46d17d; --warn:#f0b24b; --bad:#ff8a7a; --star:#f2b630; --focus:#7da2ff; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;line-height:1;margin:0;letter-spacing:.01em;font-weight:800;text-wrap:balance}
h1{font-size:clamp(34px,6vw,60px)} h2{font-size:clamp(28px,4vw,40px)} h3{font-size:22px} h4{font-size:17px;letter-spacing:.04em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:44px;padding:0 12px;width:100%;min-width:0}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
label{cursor:pointer}
.ic{flex:none;display:block}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:700;border:2px solid var(--accent);text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.sample{background:transparent;border:1px dashed var(--line)}

/* announcement + header */
.ann{background:var(--band);color:var(--on-band);font-size:13px}
.ann-in{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-block:8px;text-align:center}
.ann b{color:var(--on-band);letter-spacing:.06em}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;color:var(--accent)}
.logo svg{width:34px;height:34px;fill:currentColor}
.logo span{font:900 28px/1 var(--display);color:var(--ink);letter-spacing:.04em}
.logo small{font:600 10px/1 var(--body);letter-spacing:.28em;color:var(--muted);display:block;margin-top:3px}
.logo div{display:flex;flex-direction:column}
.search{position:relative;flex:1 1 280px;max-width:560px;display:flex}
.search input{padding-right:48px;border-radius:99px;background:var(--bg)}
.search>button{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(8,14,40,.18);z-index:70;overflow:hidden}
.sugg a{display:flex;gap:10px;align-items:center;padding:8px 12px}
.sugg a:hover,.sugg a:focus-visible{background:var(--surface-2)}
.sugg .st{width:38px;height:38px;border-radius:4px;background:var(--surface-2);flex:none;overflow:hidden}
.sugg small{color:var(--muted);display:block}
.tools{display:flex;gap:2px;margin-left:auto}
.tool{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.tool:hover{background:var(--surface-2)}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:700 11px/18px var(--body);text-align:center;padding:0 4px;font-style:normal}
.badge:empty{display:none}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.cats::-webkit-scrollbar{display:none}
.cats a{white-space:nowrap;padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted)}
.cats a:hover{background:var(--surface-2);color:var(--ink)}
.cats a.on{background:var(--ink);color:var(--bg)}
@media (max-width:700px){.search{order:5;flex-basis:100%;max-width:none}.logo small{display:none}}

/* hero */
.hero{background:var(--band);color:var(--on-band);overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;padding-block:48px}
.hero h1{font-size:clamp(52px,9.5vw,116px);font-weight:900;line-height:.88;letter-spacing:0}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--band-muted);max-width:46ch;margin-top:18px;font-size:17px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero .btn.ghost{color:var(--on-band);border-color:rgba(255,255,255,.35)}
.hero .code{margin-top:18px;font-size:14px;color:var(--band-muted)}
.hero .code b{color:var(--on-band);border:1px dashed rgba(255,255,255,.5);padding:2px 8px;border-radius:4px;letter-spacing:.08em}
.hero-art{position:relative;min-width:0;max-width:520px;justify-self:center;width:100%}
.hero-art svg{width:100%;height:auto;display:block}
@media (max-width:820px){.hero-in{grid-template-columns:minmax(0,1fr);padding-block:32px}.hero-art{max-width:360px;order:-1}}
.trust{background:var(--surface);border-bottom:1px solid var(--line)}
.trust-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-block:16px}
.trust-it{display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.3;min-width:0}
.trust-it b{display:block;font-size:14px}
.trust-it .ic{color:var(--accent)}
@media (max-width:820px){.trust-in{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sections */
.sec{padding-block:40px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-h p{color:var(--muted);margin-top:6px}
.rail-wrap{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:thin}
.rail>*{flex:0 0 min(240px,68vw);scroll-snap-align:start}
.rail-btn{position:absolute;top:36%;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 14px rgba(8,14,40,.18);z-index:2}
.rail-btn.l{left:-14px}.rail-btn.r{right:-14px}
.rail-btn.l .ic{transform:rotate(180deg)}
@media (max-width:900px){.rail-btn{display:none}}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat-t{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block}
.cat-t:hover{border-color:var(--accent)}
.cat-t .im{aspect-ratio:1/.8;background:var(--surface-2);display:grid;place-items:center}
.cat-t .im svg{width:78%;height:auto}
.cat-t b{display:block;padding:10px 12px;font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.goal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.goal{background:var(--band);color:var(--on-band);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-height:170px;position:relative;overflow:hidden}
.goal h3{font-size:30px}
.goal p{color:var(--band-muted);font-size:14px}
.goal span{margin-top:auto;font-weight:700;color:var(--on-band);display:flex;gap:6px;align-items:center}
.goal:hover span{color:var(--accent)}
@media (max-width:900px){.goal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.brands{display:flex;flex-wrap:wrap;gap:10px}
.brands a{flex:1 1 150px;text-align:center;padding:18px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font:900 24px/1 var(--display);text-transform:uppercase;letter-spacing:.06em}
.brands a:hover{border-color:var(--accent)}
.band-cta{background:var(--band);color:var(--on-band);border-radius:var(--r);padding:32px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band-cta p{color:var(--band-muted);margin-top:8px;max-width:52ch}
.news{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.news input{flex:1 1 220px;max-width:360px}
.news-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:560px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.pc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.pc:hover{border-color:var(--ink)}
.pc-img{display:block;aspect-ratio:1/1;background:var(--surface-2);position:relative;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.pc-img svg,.gal-main svg{width:100%;height:100%;display:block}
.tag{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tag span{font:700 11px/1 var(--body);padding:5px 7px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.tag .off{background:var(--accent);color:var(--on-accent)}
.tag .new{background:var(--ink);color:var(--bg)}
.tag .oos{background:var(--bad);color:#fff}
.wish{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line);z-index:2}
.wish.on{color:var(--accent);border-color:var(--accent)}
.pc-b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pc-brand{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.dot{width:12px;height:12px;border:1.5px solid var(--good);display:inline-grid;place-items:center;border-radius:2px;flex:none}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.dot.nv{border-color:var(--bad)}.dot.nv::after{background:var(--bad)}
.pc-name{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pc-name:hover{color:var(--accent)}
.pc-r{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stars{--r:90%;display:inline-block;font-size:14px;letter-spacing:1px;line-height:1}
.stars::before{content:"★★★★★";background:linear-gradient(90deg,var(--star) var(--r),var(--line) var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
.pc-p{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pc-p b{font:800 24px/1 var(--display);letter-spacing:.02em}
.pc-p s{color:var(--muted);font-size:13px}
.pc-p em{font-style:normal;color:var(--good);font-weight:700;font-size:12px}
.pc-a{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.cmp{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* shop */
.crumb{font-size:13px;color:var(--muted);padding-block:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a:hover{color:var(--accent)}
.shop-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding-bottom:48px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 16px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px)}
.fg{border-bottom:1px solid var(--line);padding:14px 0}
.fg:last-of-type{border-bottom:0}
.fg h4{margin-bottom:10px}
.fo{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.fo .sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.sbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sbar select{width:auto;min-width:180px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.fchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.fchip button:hover{background:var(--line)}
.f-toggle{display:none}
.f-close{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,9,25,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
@media (max-width:900px){
  .shop{grid-template-columns:minmax(0,1fr)}
  .f-toggle{display:inline-flex}
  .filters{position:fixed;z-index:90;left:0;top:0;bottom:0;width:min(340px,90vw);border-radius:0;overflow-y:auto;transform:translateX(-102%);transition:transform .25s;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .filters.open{transform:none}
  .f-close{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
}
.empty{padding:56px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{color:var(--muted);margin:8px 0 18px}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:860px){.pdp{grid-template-columns:minmax(0,1fr);gap:20px}}
.gal-main{aspect-ratio:1/1;background:var(--surface-2);border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--line)}
.gal-th{display:flex;gap:10px;margin-top:10px}
.gal-th button{width:76px;height:76px;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:2px solid transparent}
.gal-th button.on{border-color:var(--accent)}
.gal-th svg{width:100%;height:100%;display:block}
.p-brand{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.pdp h1{font-size:clamp(30px,4.5vw,46px);margin:8px 0 10px;line-height:.98}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 2px}
.price b{font:900 44px/1 var(--display);letter-spacing:.02em}
.price s{color:var(--muted)}
.price em{font-style:normal;background:var(--accent);color:var(--on-accent);padding:3px 8px;border-radius:3px;font-weight:700;font-size:13px}
.opt{margin-top:18px}
.opt>h4{margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.opt>h4 span{font:500 13px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:var(--r);font-weight:600;background:var(--surface);text-align:left;line-height:1.2}
.seg button small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.seg button:hover{border-color:var(--ink)}
.seg button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.seg .sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.buy-type{display:grid;gap:8px}
.buy-type label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.buy-type label.on{border-color:var(--accent)}
.buy-type small{display:block;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qty button{width:40px;height:42px;display:grid;place-items:center}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:34px;text-align:center;font-weight:700}
.buy{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.buy .btn{flex:1 1 150px}
.icon-btn{width:44px;height:44px;border:1.5px solid var(--line);border-radius:var(--r);display:grid;place-items:center;background:var(--surface)}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}
.pin{display:flex;gap:8px;margin-top:6px}
.pin input{max-width:180px}
.assure{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px;font-size:13px}
.assure div{display:flex;gap:8px;align-items:center}
.assure .ic{color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:13px;color:var(--muted)}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:36px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{white-space:nowrap;padding:7px 14px;border-radius:99px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.subnav button:hover{border-color:var(--ink)}
.psec{padding-top:34px;scroll-margin-top:170px}
.psec h2{font-size:32px;margin-bottom:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.ul{margin:0;padding-left:20px;display:grid;gap:6px}
.facts{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:10px 14px;max-width:420px}

/* ----- finder quiz ----- */
const QS = [
  { k: 'goal', q: 'What is your main goal?', o: [['muscle', 'Build muscle and strength'], ['weight', 'Lose weight and stay lean'], ['energy', 'More energy for workouts'], ['recovery', 'Recover faster between sessions']] },
  { k: 'diet', q: 'How do you eat?', o: [['veg', 'Vegetarian (dairy is fine)'], ['vegan', 'Vegan, no dairy or eggs'], ['any', 'I eat everything']] },
  { k: 'exp', q: 'How long have you been training?', o: [['new', 'Under 6 months'], ['mid', '6 months to 2 years'], ['pro', 'More than 2 years']] },
  { k: 'bud', q: 'What is your budget for the first order?', o: [['low', 'Up to ₹3,000'], ['mid', '₹3,000 to ₹6,000'], ['high', 'No limit']] }
];
function recommend(a) {
  const r = []; const add = (id, why) => { if (!r.find(x => x.id === id)) r.push({ id, why }); };
  const prot = a.diet === 'vegan' ? 'root-plant' : (a.goal === 'weight' || (a.bud === 'high' && a.goal !== 'muscle')) ? 'peak-iso' : 'forge-whey';
  add(prot, a.diet === 'vegan' ? 'Dairy-free protein to cover your daily target' : prot === 'peak-iso' ? 'Lean protein with minimal fat and sugar' : 'Good-value everyday protein');
  if (a.goal === 'muscle' || (a.goal === 'energy' && a.exp !== 'new')) add('forge-creatine', 'The most studied supplement for strength and training output');
  if (a.goal === 'energy' && a.exp !== 'new' && a.bud !== 'low') add('volt-ignite', 'Caffeine, citrulline and beta-alanine before hard sessions');
  if (a.goal === 'energy' && a.exp === 'new') add('forge-multi', 'Fills small nutrient gaps while your training habit builds');
  if (a.goal === 'recovery' && a.bud !== 'low') add('peak-eaa', 'Essential amino acids and electrolytes around training');
  if (a.goal === 'recovery') add(a.diet === 'any' ? 'peak-omega' : 'root-d3k2', a.diet === 'any' ? 'EPA and DHA from fish oil as part of a recovery routine' : 'A daily vitamin D3 and K2 basic');
  if (a.goal === 'weight' && a.bud !== 'low') add('peak-eaa', 'Low-calorie amino acids to sip while in a deficit');
  if (a.goal === 'muscle' && a.bud === 'high' && a.exp !== 'new') add('forge-mass', 'Only if you struggle to eat enough calories');
  add('aero-shaker', 'A leak-proof shaker for mixing');
  let tot = 0; const out = []; const cap = a.bud === 'low' ? 3000 : a.bud === 'mid' ? 6000 : 1e9;
  r.forEach(x => { const p = byId(x.id), pr = p.sizes[0].price; if (tot + pr <= cap || out.length === 0) { out.push(x); tot += pr; } });
  return { out, tot };
}
function renderFinder() {
  const done = Q.step >= QS.length;
  if (!done) { const q = QS[Q.step]; return `<div class="wrap page"><div class="narrow" style="max-width:640px;margin:0 auto">${crumbs([['Goal finder']])}<h1>Find my stack</h1><p class="muted" style="margin:8px 0 18px">Question ${Q.step + 1} of ${QS.length}</p><div class="prog"><b style="width:${Q.step / QS.length * 100}%"></b></div><h2 style="font-size:30px">${q.q}</h2><div class="q-opt">${q.o.map(([v, l]) => `<button data-act="qa" data-v="${v}">${l}</button>`).join('')}</div>${Q.step ? `<button class="link" style="margin-top:16px" data-act="qback">Back</button>` : ''}</div></div>`; }
  const { out, tot } = recommend(Q.a);

}

const err = (id, m) => { const e = $('#e-' + id), f = $('#f-' + id); if (e) e.textContent = m || ''; if (f) f.classList.toggle('bad', !!m); return !m; };
const luhn = n => { let s = 0, d = false; for (let i = n.length - 1; i >= 0; i--) { let x = +n[i]; if (d) { x *= 2; if (x > 9) x -= 9; } s += x; d = !d; } return s % 10 === 0; };
function placeOrder() {

    const m = g('cx').match(/^(\d{2})\/(\d{2})$/); const now = new Date(); const okx = m && +m[1] >= 1 && +m[1] <= 12 && (2000 + +m[2] > now.getFullYear() || (2000 + +m[2] === now.getFullYear() && +m[1] >= now.getMonth() + 1));

    OTP = { phone: ph.trim(), code: String(Math.floor(100000 + Math.random() * 900000)), verified: false }; S.co.ph = OTP.phone; reOtp(t.dataset.ctx);
  },
  otpstart(t) { OTP = { phone: t.dataset.ph, code: String(Math.floor(100000 + Math.random() * 900000)), verified: false }; reOtp('order'); },
  otpverify(t) {
    const v = ($('#otp-c') || {}).value || '';
    if (v.trim() !== OTP.code) { const e = $('#e-otp-c'); if (e) e.textContent = 'That code does not match. Check the demo code shown above.'; return; }
    const ctx = t.dataset.ctx, oid = ctx === 'order' ? ($('#otpbox') || {}).dataset.oid : null; loginUser(OTP.phone, oid);
    toast('Signed in'); if (ctx === 'checkout' || ctx === 'account' || ctx === 'order') render(false);
  },
  acctab(t) { ACC.tab = t.dataset.k; render(false); },
  subskip(t) { const x = S.subs.find(s => s.id === t.dataset.id); if (x) { x.next += 30 * DAY; save(); render(false); toast('Next delivery skipped'); } },
  subcancel(t) { const x = S.subs.find(s => s.id === t.dataset.id); if (x) { x.on = false; save(); render(false); toast('Subscription cancelled'); } },
  trackfill(t) { TR = { id: t.dataset.id, ph: t.dataset.ph, res: null }; },
  advance(t) { const o = S.orders.find(x => x.id === t.dataset.id); if (o && (o.stage || 0) < 4) { o.stage = (o.stage || 0) + 1; save(); TR.res = o; $('#tr-res').innerHTML = trackHTML(o); } },
  qa(t) { Q.a[QS[Q.step].k] = t.dataset.v; Q.step++; render(false); window.scrollTo(0, 0); },
  qback() { Q.step = Math.max(0, Q.step - 1); render(false); },
  qreset() { Q = { step: 0, a: {} }; render(false); },
  qaddall() { const { out } = recommend(Q.a); out.forEach(x => addCart(x.id, 0, 0, 1, false)); toast('Stack added to cart'); openCart(); }
};
function reOtp(ctx) { const b = $('#otpbox'); if (b) b.innerHTML = (ctx === 'order' && !OTP.code ? '' : otpHTML(ctx)); }
function toggleCmp(id, t) {
  const i = S.cmp.indexOf(id);
  if (i < 0) { if (S.cmp.length >= 3) { toast('You can compare up to 3 products'); if (t && t.type === 'checkbox') t.checked = false; return; } S.cmp.push(id); } else S.cmp.splice(i, 1);
  save(); render(false);
}
function saveForm() {
  const g = id => ($('#' + id) ? $('#' + id).value : undefined), c = S.co;
  [['em', 'em'], ['ph', 'ph'], ['nm', 'nm'], ['ad', 'ad'], ['pin', 'pin'], ['city', 'city'], ['st', 'st'], ['upi', 'upi'], ['cn', 'cn'], ['cx', 'cx'], ['cname', 'cname'], ['bank', 'bank']].forEach(([k, id]) => { const v = g(id); if (v !== undefined) c[k] = v; });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.matches('input,select,textarea')) return;
  const f = A[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('change', e => {
  const t = e.target; if (t.id === 'rimg') { const f = t.files[0]; if (f) shrink(f, d => { D.img = d; toast(d ? 'Photo attached' : 'Could not read that image'); }); return; }
  if (t.id === 'st' || t.id === 'bank') { saveForm(); save(); }
  const a = t.closest('[data-act]'); if (!a || !a.matches('input,select')) return;
  const f = A[a.dataset.act]; if (f) f(a, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cn') { t.value = t.value.replace(/\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim(); }
  if (t.id === 'cx') { let v = t.value.replace(/\D/g, '').slice(0, 4); if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2); t.value = v; }
  if (['ph', 'pin', 'otp-ph', 'otp-c', 'tr-ph', 'pinp', 'cv'].includes(t.id)) t.value = t.value.replace(/\D/g, '');
  if (t.closest('#co') && t.id !== 'cv') { const k = t.id; if (k) { S.co[k] = t.value; if (k === 'cv') delete S.co[k]; } }
  if (t.id === 'pin' && $('#pinmsg')) { const i = pinInfo(t.value); $('#pinmsg').innerHTML = i ? `<span class="good">Delivery by ${i.from} – ${i.to}</span>` : (t.value.length === 6 ? '<span class="bad">Check this pincode</span>' : ''); if (i) { S.pin = t.value; } }
  if (t.id === 'q') suggest(t.value);
});
document.addEventListener('submit', e => { const f = e.target, k = f.dataset.form; if (!k) return; e.preventDefault(); if (FORMS[k]) FORMS[k](f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeAll(); if (!$('#modal').hidden) A.mclose(); $('#sugg').hidden = true; } });
document.addEventListener('click', e => { if (!e.target.closest('#sf')) $('#sugg').hidden = true; });
function shrink(file, cb) { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 240 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .7)); }; im.onerror = () => cb(null); im.src = r.result; }; r.onerror = () => cb(null); r.readAsDataURL(file); }

/* ----- search ----- */
function matches(q) { const ws = q.toLowerCase().split(/\s+/).filter(Boolean); return ws.length ? P.filter(p => { const hay = (p.name + ' ' + p.brand + ' ' + CATN[p.cat] + ' ' + p.type + ' ' + p.goals.join(' ') + ' ' + p.flavs.join(' ')).toLowerCase(); return ws.every(w => hay.includes(w)); }) : []; }
function suggest(v) {
  const box = $('#sugg'), r = matches(v.trim()).slice(0, 6);
  if (!v.trim()) { box.hidden = true; return; }
  box.innerHTML = r.length ? r.map(p => `<a href="#product-${p.id}"><span class="st">${art(p, 0, 0)}</span><span>${esc(p.name)}<small>${esc(CATN[p.cat])} · from ${inr(lowest(p).price)}</small></span></a>`).join('') + `<a href="#search-${slug(v)}"><b>See all results for “${esc(v.trim())}”</b></a>` : `<a href="#shop"><span>No match for “${esc(v.trim())}”. Browse all products</span></a>`;
  box.hidden = false;
}
$('#sf').addEventListener('submit', e => { e.preventDefault(); const v = $('#q').value.trim(); if (!v) return; $('#sugg').hidden = true; location.hash = '#search-' + (slug(v) || 'all'); });
$('#sbtn').innerHTML = ic('search', 18);

/* ============ boot ============ */
window.addEventListener('hashchange', () => { render(true); });
drawFooter(); drawChat(); cartChanged(); render(true);
(() => { try { if (sessionStorage.getItem('fg_pop')) return; } catch (e) {}
  const mark = () => { try { sessionStorage.setItem('fg_pop', '1'); } catch (e) {} };
  document.addEventListener('mouseout', e => { if (!e.relatedTarget && e.clientY <= 0 && !S.sawPop && !location.hash.startsWith('#checkout')) { mark(); showPopup(); } });
  setTimeout(() => { if (!S.sawPop && matchMedia('(pointer:coarse)').matches && !location.hash.startsWith('#checkout')) { mark(); showPopup(); } }, 45000);
})();
</script>
